[pytest]
testpaths = pipeline/tests
markers =
    live: runs against a throwaway Apache Jena Fuseki (needs Java and a Fuseki download)
    e2e: drives the dashboard in a browser (needs Playwright, Fuseki, and a built frontend)
filterwarnings =
    ignore::DeprecationWarning:rdflib.*
    ignore:.*_mock_name.*:UserWarning
